worker_processes auto;

events {
    # Максимальное количество одновременных соединений на один worker-процесс.
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    upstream todo_api {
        # Алгоритм по умолчанию, если ничего не указать: round-robin.
        # Nginx отправляет запросы по очереди на каждую реплику.
        # round-robin;

        # least_conn: каждый новый запрос отправляется на реплику
        # с меньшим числом активных соединений.
        least_conn;

        # ip_hash: один и тот же клиентский IP чаще попадает на одну и ту же реплику.
        # Полезно для "липких" сессий, но хуже распределяет нагрузку.
        # ip_hash;

        # hash: распределение по выбранному ключу, например по URI запроса.
        # consistent уменьшает перераспределение ключей при добавлении/удалении реплик.
        # hash $request_uri consistent;

        # random two least_conn: случайно выбирает две реплики и берет менее загруженную.
        # Доступно в новых версиях Nginx Open Source.
        # random two least_conn;

        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Лимиты запросов на одного клиента. Для auth лимит строже, чтобы замедлять спам логинов.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=3r/s;

    # Хранилище счетчиков открытых соединений на одного клиента.
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    # Скрываем версию Nginx и возвращаем 429 при срабатывании лимитов.
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    server {
        listen 80;

        # Маленький размер тела запроса и короткие таймауты снижают нагрузку от дешевого спама.
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 30s;
        send_timeout 10s;

        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        location /auth/ {
            # Эндпоинты логина и регистрации получают более строгий лимит запросов.
            limit_req zone=auth_per_ip burst=3 nodelay;
            limit_conn connections_per_ip 10;

            # Передаем в FastAPI данные об исходном клиенте и протоколе.
            proxy_pass http://todo_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            # Для общего API разрешен больший burst, но лимит все равно действует на каждый IP.
            limit_req zone=api_per_ip burst=5 nodelay;
            limit_conn connections_per_ip 20;

            # Переиспользуем соединения к upstream и сохраняем метаданные запроса.
            proxy_pass http://todo_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
