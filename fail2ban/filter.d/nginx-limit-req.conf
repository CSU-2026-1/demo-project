[Definition]

# Nginx пишет такие сообщения, когда limit_req или limit_conn ограничивает шумного клиента.
failregex = ^\s*\[(?:warn|error)\]\s+\d+#\d+:\s+\*\d+\s+limiting requests,.*client:\s+<HOST>,.*$
            ^\s*\[(?:warn|error)\]\s+\d+#\d+:\s+\*\d+\s+limiting connections.*client:\s+<HOST>,.*$

ignoreregex =
