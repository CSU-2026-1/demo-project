services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - todo-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-todo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-todo}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - todo-network

  citus-coordinator:
    image: citusdata/citus:14.0
    container_name: citus-coordinator
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - citus_coordinator_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - todo-network

  citus-worker-1:
    image: citusdata/citus:14.0
    container_name: citus-worker-1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - citus_worker1_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - todo-network

  citus-worker-2:
    image: citusdata/citus:14.0
    container_name: citus-worker-2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - citus_worker2_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - todo-network

  api:
    build: .
    deploy:
      replicas: 2
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      citus-coordinator:
        condition: service_healthy
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo-network

  load-balancer:
    image: nginx:1.30-alpine
    container_name: todo-load-balancer
    depends_on:
      - api
    environment:
      TZ: ${LOG_TZ:-UTC}
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - todo-network

  fail2ban:
    image: crazymax/fail2ban:1.1.0
    container_name: todo-fail2ban
    depends_on:
      - load-balancer
    network_mode: "service:load-balancer"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${LOG_TZ:-UTC}
      F2B_LOG_LEVEL: INFO
    volumes:
      - ./fail2ban:/data
      - ./nginx/logs:/var/log/nginx:ro
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: todo-nginx-exporter
    depends_on:
      - load-balancer
    command:
      - --nginx.scrape-uri=http://load-balancer/nginx_status
    ports:
      - "9113:9113"
    networks:
      - todo-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: todo-prometheus
    depends_on:
      - nginx-exporter
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - todo-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: todo-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - todo-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      citus-coordinator:
        condition: service_healthy
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  citus_coordinator_data:
  citus_worker1_data:
  citus_worker2_data:
  prometheus_data:
  grafana_data:
