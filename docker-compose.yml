version: "3.9"

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - todo-network

  api:
    build: .
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      - db
    ports:
      - "8888:8000"
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  db_data:
